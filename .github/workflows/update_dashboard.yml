name: Update Market Dashboard

on:
  # Run automatically every 4 hours
  schedule:
    - cron: '30 15 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    # Grant permissions needed to commit back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip' # cache pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Dashboard HTML
        env:
          # Pulls the API key from your GitHub Repository Secrets
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python generate_dashboard.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only commit if the HTML file actually changed
          git add market_risk.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market dashboard" && git push)
